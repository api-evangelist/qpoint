aid: qpoint
name: Qpoint
description: >-
  Qpoint is a security and observability company that uses eBPF to give teams full visibility and
  control over egress and service-to-service traffic without proxies, sidecars, or code changes. Its
  product line includes qtap (a lightweight eBPF sensor that captures pre-encrypted HTTPS traffic and
  the originating process context), Qplane (a cloud-managed control plane and dashboard), qscan (an
  artifact/PII scanner), and qcontrol (agentic-AI security controls, in beta). Qpoint exposes its
  telemetry through a Connect RPC / gRPC data plane, a hosted Model Context Protocol (MCP) server for
  AI agents, plugin SDKs in Rust, C, and Zig, and OpenTelemetry/Prometheus integrations. Backed by
  Bloomberg Beta and Uncork Capital.
